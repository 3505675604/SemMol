experiment:
  name: "semmol_finetune_clintox"
  mode: "finetune"
  seed: 3407

model:
  encoders: configs/model/encoders.yaml
  projection: configs/model/projection.yaml
  dcl: configs/model/dcl.yaml
  acsm: configs/model/acsm.yaml
  modalities: ["1d", "2d", "3d"]
  anchor_modality: "1d"
  freeze_encoders: false

pretrained_ckpt: checkpoints/pretrain/semmol_pretrain_3m_best.pt
drop_modalities: []

data:
  dataset: clintox
  store_dir: data/processed/moleculenet/clintox
  train_manifest: data/processed/moleculenet/clintox/views/train.npz
  valid_manifest: data/processed/moleculenet/clintox/views/valid.npz
  test_manifest: data/processed/moleculenet/clintox/views/test.npz
  tokenizer_dir: data/processed/pcqm/tokenizer
  modalities: ["1d"]
  strict_modalities: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

task:
  type: classification
  num_tasks: 2
  metrics: [roc_auc]
  main_metric: roc_auc

train:
  batch_size: 64
  epochs: 100
  accum_steps: 1
  grad_clip: 1.0
  mixed_precision: "bf16"

  optimizer:
    type: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]

  scheduler:
    type: cosine
    warmup_ratio: 0.05
    min_lr: 1.0e-6

  early_stopping:
    enabled: true
    patience: 20
    mode: max

eval:
  num_seeds: 10
  seeds: [42, 2025, 3407, 7, 123, 456, 789, 1010, 2026, 3030]

distributed:
  backend: nccl
  world_size: 1
  broadcast_buffers: false
  sync_batchnorm: false

output:
  checkpoint_dir: checkpoints/finetune
  log_dir: outputs/logs
  save_best: true
  log_interval: 20
  tensorboard: true
  wandb: false
