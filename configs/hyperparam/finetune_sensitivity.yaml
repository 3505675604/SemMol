name: "Finetune Parameter Sensitivity"
description: >
  Sensitivity analysis of finetuning hyperparameters on MoleculeNet tasks.
  Suitable for classification (AUC) or regression (RMSE) evaluation.

search_strategy: grid

axes:
  - path: "train.optimizer.lr"
    values: [5.0e-6, 1.0e-5, 3.0e-5, 5.0e-5, 1.0e-4]
    value_type: float

  - path: "train.optimizer.weight_decay"
    values: [0.0, 0.01, 0.05, 0.1]
    value_type: float

  - path: "train.batch_size"
    values: [16, 32, 64]
    value_type: int

  - path: "train.scheduler.warmup_ratio"
    values: [0.0, 0.05, 0.1, 0.2]
    value_type: float

constraints: []

evaluation:
  mode: finetune
  fast_epochs: 20
  metrics: ["val_loss"]
  direction: minimize

seed: 3407
max_trials: 60