feature_dim: 256
num_clusters: 256
ema_momentum: 0.9

init_method: kmeans_plus_plus
init_num_iters: 10
init_max_samples: 4096
init_seed: 3407
reassign_interval: 1
assignment_temperature: 0.5
# Ordinary Euclidean K-means and raw EMA as in Eqs. (2)-(3).
# true selects the explicit cosine/spherical clustering variant.
center_l2_normalize: false
distributed_sync: true
warmup_steps: 1000

eps: 1.0e-8
validate_values: false
