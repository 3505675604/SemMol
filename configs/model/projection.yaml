input_dim: 512               
output_dim: 256             
# Eq. (1): one MLP with identical weights for 1D/2D/3D. SAP is opt-in.
share_mlp_weights: true
projection_types:
  1d: mlp
  2d: mlp
  3d: mlp
  qm: sap
normalize_eps: 1.0e-8
validate_values: false      

mlp:
  hidden_dim: 512
  num_layers: 2
  activation: gelu
  dropout: 0.1
  bias: true
  layer_norm_eps: 1.0e-5

sap:
  hidden_dim: 512
  num_heads: 8
  num_semantic_tokens: 16
  dropout: 0.1
  feedforward_multiplier: 4
  layer_norm_eps: 1.0e-5
  learnable_temperature: true
  temperature_init: 1.0
